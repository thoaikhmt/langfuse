name: Build custom base path images

# NEXT_PUBLIC_BASE_PATH is inlined into the web client bundle and /_next/static
# assets at build time, so the published langfuse/langfuse image cannot be
# reused for a custom base path. This workflow builds the web + worker images
# from source with /langfuse baked in and pushes them to GHCR, and to Docker Hub
# when the DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets are configured.
#
# https://langfuse.com/self-hosting/custom-base-path
on:
  workflow_dispatch:
    inputs:
      base_path:
        description: Next.js base path baked into the web image
        required: false
        default: /langfuse
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"

permissions: {}

concurrency:
  group: build-custom-base-path-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            dockerfile: web/Dockerfile
            image_suffix: ""
            build_args: |
              NEXT_PUBLIC_BASE_PATH=${{ github.event.inputs.base_path || '/langfuse' }}
              NEXT_PUBLIC_BUILD_ID=${{ github.sha }}
          - target: worker
            dockerfile: worker/Dockerfile
            image_suffix: -worker
            build_args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}${{ matrix.image_suffix }}
            ${{ (secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '') && format('docker.io/{0}{1}', secrets.DOCKERHUB_USERNAME, matrix.image_suffix) || '' }}
          tags: |
            type=ref,event=branch,prefix=langfuse-
            type=ref,event=tag,prefix=langfuse-
            type=sha,format=short,prefix=langfuse-
            type=raw,value=langfuse,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push ${{ matrix.target }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.target }}-langfuse
          cache-to: type=gha,scope=${{ matrix.target }}-langfuse,mode=max

      - name: Summary
        env:
          TARGET: ${{ matrix.target }}
          TAGS: ${{ steps.meta.outputs.tags }}
          BASE_PATH: ${{ github.event.inputs.base_path || '/langfuse' }}
        run: |
          {
            echo "### Pushed \`${TARGET}\` image"
            echo ""
            echo "Base path: \`${BASE_PATH}\`"
            echo ""
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
